# render.yaml
# Place this file in the ROOT of your GitHub repository.
# Render reads it automatically and creates all three services below
# when you click "New > Blueprint" in the Render dashboard.
#
# Repository structure expected:
#   /
#   ├── index.html        ← frontend (Static Site)
#   ├── api.php           ← backend (Web Service)
#   ├── Dockerfile        ← used by the Web Service
#   ├── smarthome_db.sql  ← run this manually in your DB console once
#   └── render.yaml       ← this file

services:

  # ── 1. PHP API Backend ──────────────────────────────────────────────────────
  - type: web
    name: smarthome-api
    runtime: docker          # Uses your Dockerfile
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Set actual values in the Render dashboard → Environment tab.
      # These keys must match exactly what api.php reads with getenv().
      - key: DB_HOST
        sync: false          # fill in manually: your PlanetScale/Railway host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: smarthome_db
      - key: DB_USER
        sync: false          # fill in manually
      - key: DB_PASS
        sync: false          # fill in manually
      - key: FRONTEND_URL
        sync: false          # fill in manually after Static Site is created
                             # e.g. https://smarthome-frontend.onrender.com
      - key: INIT_SECRET
        generateValue: true  # auto-generates a random secret for /init_password

  # ── 2. HTML Frontend ────────────────────────────────────────────────────────
  - type: web
    name: smarthome-frontend
    runtime: static
    staticPublishPath: .     # serves index.html from the repo root
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache      # always fetch fresh HTML (avoids stale JS after deploys)
